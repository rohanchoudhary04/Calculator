<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body >
    <div class="container"> 
        <input type="text" class="task"/>
        <input type="text" class="answer"/>

        <br>
        <div class="cal-btn">
        <div>
        <button class="btn btn-trigo">e</button>
        <button class="btn btn-trigo">sin</button>
        <button class="btn btn-trigo">cos</button>
        <button class="btn btn-trigo">deg</button>
        </div>
        <div>
        <button class="btn btn-clear">C</button>
        <button class="btn">(</button>
        <button class="btn">)</button>
        <button class="btn btn-sign">+</button>
        </div>
        <div>
        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button class="btn btn-sign">-</button>
        </div>
        <div>
        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button class="btn btn-sign">*</button>
        </div>
        <div>
        <button class="btn">3</button>
        <button class="btn">2</button>
        <button class="btn">1</button>
        <button class="btn btn-sign">/</button>
        </div>
        <div>
        <button class="btn">.</button>
        <button class="btn">0</button>
        <button class="btn">DEL</button>
        <button class="btn btn-equal">=</button>
        </div>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script src="darkmode.js"></script>
</body>
</html>
